name: Rust Release

on:
  push:
    branches:
      # Always run on main branch.
      - main
    tags:
      - '*'
  workflow_dispatch:


jobs:
  release:
    name: ${{ matrix.platform.os-name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os-name: FreeBSD-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-freebsd

          - os-name: Linux-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

          - os-name: Linux-aarch64
            runs-on: ubuntu-24.04
            target: aarch64-unknown-linux-gnu

          - os-name: Linux-x86_64-musl
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-musl

          - os-name: Linux-aarch64-musl
            runs-on: ubuntu-24.04
            target: aarch64-unknown-linux-musl

          - os-name: Windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc

          - os-name: macOS-x86_64
            runs-on: macOS-latest
            target: x86_64-apple-darwin

          - os-name: macOS-arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@f7da4010930154943c99d13df0151dece91a924f
        with:
          command: build
          target: ${{ matrix.platform.target }}
          toolchain: "1.88"
          args: "--locked --release"
          strip: true
      - name: Create archive (Unix)
        if: matrix.platform.os-name != 'Windows-x86_64'
        run: tar -czvf mcp-proxy-${{ matrix.platform.target }}.tar.gz -C target/*/release mcp-proxy
      - name: Create archive (Windows)
        if: matrix.platform.os-name == 'Windows-x86_64'
        working-directory: target\\${{ matrix.platform.target }}\\release
        run: 7z a ..\\..\\..\\mcp-proxy-${{ matrix.platform.target }}.zip mcp-proxy.exe
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-proxy-${{ matrix.platform.target }}
          path: mcp-proxy-${{ matrix.platform.target }}.*
      - name: Release
        uses: softprops/action-gh-release@39ba0b9d81217c984acfad95ddcc7db226387497
        if: github.ref_type == 'tag'
        with:
          files: 'mcp-proxy-${{ matrix.platform.target }}.*'
          # Explicit: the action preserves an existing release's draft flag when
          # this input is unset, so a re-run over a draft release would silently
          # upload assets and never publish them.
          draft: false
          make_latest: true

  checksums:
    name: Checksums
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum mcp-proxy-* > ../SHA256SUMS
          cat ../SHA256SUMS
      - name: Attach SHA256SUMS to release
        uses: softprops/action-gh-release@39ba0b9d81217c984acfad95ddcc7db226387497
        with:
          files: SHA256SUMS
          draft: false
          make_latest: true
