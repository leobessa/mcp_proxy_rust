[package]
name = "mcp-proxy"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
rmcp = { version = "1.5.0", features = [
    "server",
    "client",
    "reqwest",
    "client-side-sse",
    "transport-streamable-http-client-reqwest",
    "transport-worker",
    "transport-child-process"
] }
clap = { version = "4.5.37", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
anyhow = "1.0.98"
futures = "0.3.31"
tokio-util = "0.7.15"
reqwest = { version = "0.13", features = ["json", "stream"] }
# Must stay in lockstep with the version rmcp depends on, so the `Sse` and
# `Error` types unify with `StreamableHttpPostResponse::Sse`.
sse-stream = "0.2"
http = "1"
serde_json = "1.0"

[dev-dependencies]
rmcp = { version = "1.5.0", features = [
    "server",
    "client",
    "reqwest",
    "client-side-sse",
    "transport-child-process",
    "transport-streamable-http-server",
    "macros",
    "elicitation",
    "schemars"
] }
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
